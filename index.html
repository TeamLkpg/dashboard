<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>

  <body>
    <header>
      <h1>Historical temperature data</h1>
      <nav>
        <ul>
          <li><a href="temperature.csv">Download data</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="sortingSection">
        <section class="sortingTime">
          <h3 class="sortingHeader">Timespan - Year</h3>
          <!--Timespan slider-->
          <p>Choose a timespan with the sliders</p>
          <section class="range-container">
            <div class="range-slider">
              <input
                type="range"
                id="lower"
                min="1850"
                max="2020"
                value="1850"
                aria-label="Lower range value"
              />
              <input
                type="range"
                id="upper"
                min="1850"
                max="2020"
                value="2020"
                aria-label="Upper range value"
              />
              <span class="track"></span>
              <span class="range" id="range"></span>
            </div>
            <div class="slider-value">
              <output for="lower" id="lower-value">
                <span id="display-low-value">1850</span>
              </output>
              <output for="upper" id="upper-value">
                <span id="display-high-value">2020</span>
              </output>
            </div>
          </section>
          <!--Timespan slider-->
          <button
            onclick="toggleShow()"
            alt="Click to choose begining and end to select what span to take a closer look at"
          >
            Or select your desired time span by clicking here:
          </button>
          <section id="hiddenCalendar" class="dropdown-calendar">
            <section>
              <label>
                Time to start at (min 1850):
                <input type="number" id="startTime" placeholder="X" />
              </label>
              <label>
                Time to end at (max 2020):
                <input type="number" id="endTime" placeholder="Y" />
              </label>
            </section>
          </section>
        </section>

        <section class="sortingLocation">
          <h3 class="sortingHeader">Location</h3>
          <p>Choose one or several locations</p>
          <section class="checkLocationBox" id="checkLocationBox"></section>
        </section>
      </section>

      <section class="chartSection">
        <canvas id="chart" class="chart"></canvas>
      </section>
    </main>
